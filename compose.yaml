services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: local-news-only
      POSTGRES_DB: news
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - news-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  news-data:
