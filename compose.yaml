services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: local-news-only
      POSTGRES_DB: news
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - news-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 2s
      timeout: 3s
      retries: 15
  ollama:
    image: ollama/ollama:0.12.10
    profiles: ["embeddings"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
volumes:
  news-data:
  ollama-data:
