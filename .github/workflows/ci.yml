name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts throws when DATABASE_URL is unset, and
      # `pnpm check` runs `prisma generate`. No connection is made here.
      DATABASE_URL: postgresql://news:local-news-only@127.0.0.1:55432/news
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test
